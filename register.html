```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <title>MediStock - Registration</title>
</head>

<body>

    <div class="login-page">

        <div class="medicine-section">

            <div class="brand">
                <span class="brand-icon">✚</span>
                <span>MediStock</span>
            </div>

            <h1>Medicine Stock<br>Management System</h1>

            <p>
                Create your MediStock account to manage
                medicines and inventory efficiently.
            </p>

            <div class="medicine-icons">
                <span>💊</span>
                <span>🩺</span>
                <span>💉</span>
            </div>

        </div>


        <div class="login-section">

            <div class="login-box">

                <h2>Create Account</h2>

                <p class="login-subtitle">
                    Register for your MediStock account
                </p>

                <label for="registerUsername">Username</label>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Enter your username"
                >

                <label for="registerEmail">Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                >

                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Enter your password"
                >

                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                >

                <button onclick="registerUser()">Register</button>

                <p class="register-text">
                    Already have an account?
                    <a href="index.html">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
```
